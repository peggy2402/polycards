<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-dog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow-dog" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="600" height="600" rx="36" fill="url(#grad-dog)" />
  <circle cx="300" cy="270" r="170" fill="#2563EB" fill-opacity="0.08"/>
  <circle cx="300" cy="270" r="130" fill="#2563EB" fill-opacity="0.14"/>

  <!-- Geometric Symbol Container -->
  <g filter="url(#shadow-dog)">
    <rect x="180" y="150" width="240" height="240" rx="40" fill="#FFFFFF"/>
    <circle cx="300" cy="250" r="60" fill="#2563EB" fill-opacity="0.15"/>
    <!-- Clean Stylized Vector Monogram -->
    <text x="300" y="275" font-size="72" font-weight="900" text-anchor="middle" fill="#2563EB" font-family="system-ui, -apple-system, sans-serif">D</text>
    <text x="300" y="340" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#2563EB" font-family="system-ui, -apple-system, sans-serif">3D MODEL</text>
  </g>

  <!-- Title & Meaning -->
  <text x="300" y="440" font-size="34" font-weight="800" text-anchor="middle" fill="#1F2937" font-family="system-ui, -apple-system, sans-serif">DOG</text>
  <text x="300" y="480" font-size="22" font-weight="600" text-anchor="middle" fill="#6B7280" font-family="system-ui, -apple-system, sans-serif">Con Chó</text>

  <!-- Clean Placeholder Label -->
  <g transform="translate(190, 520)">
    <rect width="220" height="32" rx="16" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="1.2"/>
    <text x="110" y="21" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#4B5563" font-family="system-ui, -apple-system, sans-serif">SAMPLE ASSET</text>
  </g>
</svg>